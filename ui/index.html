<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riverbed</title>
<style>
  :root {
    color-scheme: light dark;

    --ground: #f3f5f2;
    --surface: #fbfcfb;
    --ink: #18201d;
    --ink-2: #55635d;
    --rule: #dbe1de;
    --rule-strong: #c1cbc6;
    --accent: #1d6b64;
    --on-accent: #ffffff;
    --accent-soft: #e0eeeb;
    --ok: #2f7a4f;
    --warn: #93610b;
    --run: #2a5fa8;
    --bad: #b1362b;

    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

    --t-xs: .75rem;
    --t-sm: .8125rem;
    --t-base: .9375rem;
    --t-note: 1.0625rem;
    --t-lead: 1.375rem;

    --gap: 1.5rem;
    --radius: 6px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0f1513;
      --surface: #151c19;
      --ink: #e4ebe8;
      --ink-2: #9aaba4;
      --rule: #232d29;
      --rule-strong: #34423d;
      --accent: #63c1b6;
      --on-accent: #0c1a17;
      --accent-soft: #16302c;
      --ok: #6cc38f;
      --warn: #e0a94f;
      --run: #7fadee;
      --bad: #f0857a;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0 auto;
    max-width: 42rem;
    padding: 1.25rem 1rem 4rem;
    background: var(--ground);
    color: var(--ink);
    font: var(--t-base)/1.5 var(--sans);
  }
  a { color: var(--accent); }
  h1, h2, h3, p, dl, dd, ul { margin: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Header */
  header {
    display: flex; align-items: center; gap: 1.5rem;
    padding-bottom: .875rem; margin-bottom: var(--gap);
    border-bottom: 1px solid var(--rule);
  }
  .brand { font: 600 1.25rem/1 var(--serif); letter-spacing: -.01em; color: var(--ink); text-decoration: none; }
  nav { display: flex; gap: 1.25rem; }
  nav a { padding-block: .25rem; color: var(--ink-2); text-decoration: none; border-bottom: 2px solid transparent; }
  nav a:hover { color: var(--ink); }
  nav a[aria-current] { color: var(--ink); border-bottom-color: var(--accent); }
  .spacer { flex: 1; }

  main { display: flex; flex-direction: column; gap: var(--gap); }

  /* Controls */
  input, select, textarea, button { font: inherit; color: var(--ink); }
  input, select, textarea {
    width: 100%; padding: .45rem .65rem;
    background: var(--surface); border: 1px solid var(--rule-strong); border-radius: var(--radius);
  }
  ::placeholder { color: var(--ink-2); opacity: .8; }
  textarea { display: block; resize: vertical; line-height: 1.45; }
  button {
    padding: .4rem .9rem; cursor: pointer; font-size: var(--t-sm); font-weight: 500;
    background: transparent; border: 1px solid var(--rule-strong); border-radius: var(--radius);
  }
  button:hover { background: var(--accent-soft); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { margin-left: auto; color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  button.danger:hover { background: color-mix(in srgb, var(--bad) 12%, transparent); }
  button.quiet { border-color: transparent; color: var(--ink-2); }
  @media (prefers-reduced-motion: no-preference) {
    button { transition: background-color .12s, filter .12s; }
  }

  /* Composer: the one raised object on the list page */
  .compose { padding: .75rem .875rem; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
  .compose:focus-within { border-color: var(--accent); }
  .compose textarea { padding: 0; border: 0; background: transparent; font: var(--t-note)/1.45 var(--serif); }
  .compose textarea:focus-visible { outline: none; }
  .compose .row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: .5rem; }
  .compose .hint { font-size: var(--t-xs); color: var(--ink-2); }

  /* Filters */
  .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); gap: .5rem; }
  .filters .wide { grid-column: 1 / -1; }
  .filters select, .filters input { font-size: var(--t-sm); }

  /* Timeline */
  .day { display: flex; flex-direction: column; }
  .day h2 {
    padding-bottom: .4rem; border-bottom: 1px solid var(--rule);
    font-size: var(--t-xs); font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2);
  }
  .notes { list-style: none; padding: 0; }
  .notes li + li { border-top: 1px solid var(--rule); }
  a.note {
    display: grid; grid-template-columns: 4.75rem minmax(0, 1fr); gap: .75rem;
    padding: .875rem 0; color: inherit; text-decoration: none;
  }
  a.note:hover .text { color: var(--accent); }
  .time {
    display: flex; flex-direction: column; padding-top: .3rem;
    font: var(--t-xs)/1.35 var(--mono); font-variant-numeric: tabular-nums; color: var(--ink-2);
  }
  .text { font: var(--t-note)/1.45 var(--serif); white-space: pre-wrap; overflow-wrap: anywhere; text-wrap: pretty; }
  a.note .text {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
  }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .75rem; margin-top: .375rem; font-size: var(--t-xs); color: var(--ink-2); }
  .tag { display: inline-flex; align-items: center; gap: .25rem; }
  .tag button { padding: 0 .25rem; line-height: 1.2; border: 0; font-size: var(--t-sm); color: var(--ink-2); }
  .pill {
    --c: var(--ink-2);
    display: inline-block; padding: .05rem .5rem; border-radius: 999px;
    font-size: var(--t-xs); font-weight: 600; letter-spacing: .03em; color: var(--c);
    background: color-mix(in srgb, var(--c) 13%, transparent);
  }
  .pill[data-status="done"] { --c: var(--ok); }
  .pill[data-status="pending"] { --c: var(--warn); }
  .pill[data-status="running"] { --c: var(--run); }
  .pill[data-status="failed"] { --c: var(--bad); }
  .empty { padding: 2rem 0; color: var(--ink-2); }
  .more { align-self: flex-start; }

  /* One note */
  .back { font-size: var(--t-sm); }
  .note-view { display: flex; flex-direction: column; gap: .75rem; }
  .note-view .text { font-size: var(--t-lead); line-height: 1.4; }
  .stamp { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .75rem; font: var(--t-xs)/1.4 var(--mono); font-variant-numeric: tabular-nums; color: var(--ink-2); }
  audio { width: 100%; height: 2.25rem; accent-color: var(--accent); }
  .tags { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; font-size: var(--t-sm); color: var(--ink-2); }
  .tags form { flex: 0 1 8rem; }
  .tags input { padding: .2rem .5rem; font-size: var(--t-xs); }
  .facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .4rem 1.25rem; padding-top: 1rem; border-top: 1px solid var(--rule); font-size: var(--t-sm); }
  .facts dt { font-size: var(--t-xs); font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); padding-top: .1rem; }
  .facts dd { overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .error { color: var(--bad); }
  .reply { display: flex; flex-direction: column; gap: .5rem; padding: .875rem 1rem; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
  .reply header { display: flex; justify-content: space-between; gap: 1rem; padding: 0; margin: 0; border: 0; font-size: var(--t-xs); color: var(--ink-2); }
  .reply header strong { font-weight: 600; letter-spacing: .07em; text-transform: uppercase; }
  .reply .text { font: var(--t-base)/1.55 var(--sans); }
  .reply header span { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .calls { display: flex; flex-direction: column; gap: .5rem; }
  details { border: 1px solid var(--rule); border-radius: var(--radius); }
  summary { padding: .5rem .75rem; cursor: pointer; font: var(--t-sm) var(--mono); }
  summary.bad { color: var(--bad); }
  pre { margin: 0; padding: .75rem; overflow-x: auto; border-top: 1px solid var(--rule); font: var(--t-xs)/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; gap: .5rem; padding-top: 1rem; border-top: 1px solid var(--rule); }
  form.edit { display: flex; flex-direction: column; gap: .75rem; }
  form.edit textarea { font: var(--t-lead)/1.4 var(--serif); }
  form.edit .row { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; }
  form.edit label { display: flex; align-items: center; gap: .4rem; margin-right: auto; font-size: var(--t-sm); color: var(--ink-2); }
  form.edit input[type=checkbox] { width: auto; }

  /* Status and config */
  .label { font-size: var(--t-xs); font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
  section.block { display: flex; flex-direction: column; gap: .625rem; }
  .counts { display: flex; flex-wrap: wrap; gap: .75rem 2.5rem; }
  a.count { display: flex; flex-direction: column; gap: .25rem; color: var(--ink); text-decoration: none; }
  a.count b { font: 500 2rem/1 var(--serif); font-variant-numeric: tabular-nums; }
  a.count:hover b { color: var(--accent); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
  th { font-size: var(--t-xs); font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
  th, td { padding: .4rem 1.25rem .4rem 0; text-align: left; vertical-align: top; border-bottom: 1px solid var(--rule); }
  td:last-child, th:last-child { padding-right: 0; }
  td { overflow-wrap: anywhere; }
  .muted { color: var(--ink-2); }
  form.config { display: flex; flex-direction: column; align-items: flex-start; gap: .75rem; }
  form.config textarea { font: var(--t-sm)/1.55 var(--mono); }
  .path { font: var(--t-xs) var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }

  /* Login */
  form.login { display: flex; flex-direction: column; align-items: flex-start; gap: .75rem; max-width: 20rem; }
  form.login label { display: flex; flex-direction: column; gap: .3rem; width: 100%; font-size: var(--t-sm); color: var(--ink-2); }
</style>
</head>
<body>
<header>
  <a class="brand" href="#/">Riverbed</a>
  <nav aria-label="Main">
    <a href="#/" data-section="notes">Notes</a>
    <a href="#/status" data-section="status">Status</a>
    <a href="#/config" data-section="config">Config</a>
  </nav>
  <span class="spacer"></span>
  <button id="logout" class="quiet" hidden>Log out</button>
</header>
<main id="main"></main>

<script>
const main = document.getElementById("main");
const logoutButton = document.getElementById("logout");
let status = null;

// h builds an element. Children are text nodes, so note content is never parsed as HTML.
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const c of children.flat(Infinity)) if (c != null) el.append(c);
  return el;
}

// show replaces the page content, skipping null children.
const show = (...children) => main.replaceChildren(...children.flat(Infinity).filter((c) => c != null));

class AuthError extends Error {}

async function api(path, opts = {}) {
  const init = { method: opts.method || "GET", headers: {} };
  if (opts.body !== undefined) {
    init.headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(opts.body);
  }
  const res = await fetch("/api/" + path, init);
  if (res.status === 401 && path !== "login") throw new AuthError();
  if (!res.ok) {
    let message = res.statusText;
    try { message = (await res.json()).error || message; } catch {}
    throw new Error(message);
  }
  if (res.status === 204) return null;
  return res.json();
}

const dateTime = (s) => new Date(s).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
const clock = (s) => new Date(s).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
const shortDate = (s) => new Date(s).toLocaleDateString(undefined, { month: "short", day: "numeric" });

function dayLabel(s) {
  const d = new Date(s);
  const start = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const days = Math.round((start(new Date()) - start(d)) / 864e5);
  if (days === 0) return "Today";
  if (days === 1) return "Yesterday";
  const sameYear = d.getFullYear() === new Date().getFullYear();
  return d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: sameYear ? undefined : "numeric" });
}

const pill = (status) => h("span", { class: "pill", "data-status": status }, status);

function fail(err) {
  if (err instanceof AuthError) return login();
  show(h("p", { class: "error" }, err.message));
}

function login(message) {
  logoutButton.hidden = true;
  const input = h("input", { id: "password", type: "password", name: "password", autofocus: true, autocomplete: "current-password" });
  show(h("form", {
    class: "login",
    onsubmit: async (e) => {
      e.preventDefault();
      try {
        await api("login", { method: "POST", body: { password: input.value } });
        route();
      } catch (err) {
        login(err.message);
      }
    },
  }, h("label", { for: "password" }, "Password", input), h("button", { class: "primary" }, "Log in"),
    message ? h("p", { class: "error" }, message) : null));
}

logoutButton.addEventListener("click", async () => {
  await api("logout", { method: "POST" });
  status = null;
  login();
});

// Notes list.

async function list(params) {
  const searching = Boolean(params.get("q"));

  const area = h("textarea", { id: "compose", rows: 2, placeholder: "Add a note", "aria-label": "Add a note" });
  const compose = h("form", { class: "compose", onsubmit: async (e) => {
    e.preventDefault();
    try {
      await api("notes", { method: "POST", body: { text: area.value } });
      route();
    } catch (err) { fail(err); }
  } }, area, h("div", { class: "row" },
    h("span", { class: "hint" }, "Typed notes are routed like spoken ones."),
    h("button", { class: "primary" }, "Add note")));

  const select = (name, label, values) => h("select", { id: name, name, "aria-label": label },
    h("option", { value: "" }, label),
    values.map(([v, text]) => h("option", { value: v, selected: params.get(name) === v }, text)));
  const filters = h("form", { class: "filters", onsubmit: (e) => {
    e.preventDefault();
    const q = new URLSearchParams();
    for (const [k, v] of new FormData(e.target)) if (v) q.set(k, v);
    location.hash = "#/?" + q;
  } },
    h("input", { id: "q", class: "wide", type: "search", name: "q", placeholder: "Search by wording or meaning", "aria-label": "Search", value: params.get("q") || "" }),
    select("status", "Any status", ["pending", "running", "done", "failed"].map((s) => [s, s])),
    select("route", "Any route", [status.router.default, ...status.router.rules.map((r) => r.agent)]
      .filter((v, i, a) => a.indexOf(v) === i).map((r) => [r, r])),
    select("since_days", "Any time", [["1", "Past day"], ["7", "Past week"], ["30", "Past month"]]),
    h("input", { id: "tag", type: "text", name: "tag", placeholder: "Tag", "aria-label": "Tag", value: params.get("tag") || "" }),
    h("button", { class: "primary" }, "Search"));

  const limit = Number(params.get("limit")) || 20;
  const q = new URLSearchParams(params);
  q.set("limit", limit);
  const notes = await api("notes?" + q);

  const groups = [];
  for (const n of notes) {
    // Search results are ranked, so grouping them by day would reorder them.
    const label = searching ? "" : dayLabel(n.recorded_at);
    if (!groups.length || groups.at(-1).label !== label) groups.push({ label, notes: [] });
    groups.at(-1).notes.push(n);
  }

  const results = notes.length
    ? groups.map((g) => h("section", { class: "day" }, g.label ? h("h2", {}, g.label) : null,
        h("ul", { class: "notes" }, g.notes.map((n) => h("li", {}, summary(n, searching))))))
    : h("p", { class: "empty" }, "No notes match.");
  const more = notes.length === limit
    ? h("a", { class: "more", href: "#/?" + new URLSearchParams({ ...Object.fromEntries(params), limit: limit + 20 }) }, "Show more")
    : null;
  show(compose, filters, results, more);
}

function summary(n, withDate) {
  const meta = [];
  if (n.status !== "done") meta.push(pill(n.status));
  // The default route is on nearly every note, so naming it adds noise.
  if (n.route && n.route !== status.router.default) meta.push(h("span", {}, n.route));
  for (const t of n.tags) meta.push(h("span", { class: "tag" }, "#" + t));
  return h("a", { class: "note", href: "#/note/" + n.id },
    h("span", { class: "time" }, withDate ? h("span", {}, shortDate(n.recorded_at)) : null, h("span", {}, clock(n.recorded_at))),
    h("span", {},
      h("div", { class: "text" }, n.text || "(no transcription)"),
      meta.length ? h("div", { class: "meta" }, meta) : null));
}

// One note.

async function detail(id) {
  const n = await api("notes/" + id);

  const facts = [
    ["Recorded", dateTime(n.recorded_at)],
    ["Received", dateTime(n.received_at)],
    ["Device", n.client],
  ];
  if (n.attempts) facts.push(["Attempts", String(n.attempts)]);
  if (n.route) facts.push(["Route", n.route + (n.route_reason ? ` — ${n.route_reason}` : "")]);
  if (n.prompt && n.prompt !== n.text) facts.push(["Prompt", n.prompt]);
  if (n.error) facts.push(["Error", h("span", { class: "error" }, n.error)]);

  const tagInput = h("input", { id: "tag-input", type: "text", placeholder: "Add tag", "aria-label": "Add tag" });
  const tags = h("div", { class: "tags" },
    n.tags.map((t) => h("span", { class: "tag" }, "#" + t,
      h("button", { title: "Remove tag", "aria-label": "Remove tag " + t,
        onclick: () => act(api(`notes/${id}/tags/${encodeURIComponent(t)}`, { method: "DELETE" })) }, "×"))),
    h("form", { onsubmit: (e) => {
      e.preventDefault();
      if (tagInput.value.trim()) act(api(`notes/${id}/tags`, { method: "POST", body: { tag: tagInput.value } }));
    } }, tagInput));

  const textBox = h("div", { class: "text" }, n.text || "(no transcription)");
  const editButton = h("button", { onclick: () => {
    const area = h("textarea", { id: "edit-text", rows: 5, "aria-label": "Note text" });
    area.value = n.text;
    const replay = h("input", { id: "edit-replay", type: "checkbox" });
    const form = h("form", { class: "edit", onsubmit: (e) => {
      e.preventDefault();
      if (replay.checked && !confirm("Run the edited note through routing and its agent again? Agent actions may repeat.")) return;
      act(api("notes/" + id, { method: "PUT", body: { text: area.value, replay: replay.checked } }));
    } }, area, h("div", { class: "row" },
      h("label", { for: "edit-replay" }, replay, "Replay after saving"),
      h("button", { type: "button", onclick: route }, "Cancel"),
      h("button", { class: "primary" }, "Save")));
    textBox.replaceWith(form);
    editButton.hidden = true;
    area.focus();
  } }, "Edit");

  const actions = h("div", { class: "actions" }, editButton);
  if (n.status === "failed" || n.status === "done") {
    actions.append(h("button", { onclick: () => {
      if (n.status === "done" && !confirm("Run this note through routing and its agent again? Agent actions may repeat.")) return;
      act(api(`notes/${id}/replay`, { method: "POST" }));
    } }, n.status === "failed" ? "Retry" : "Replay"));
  }
  actions.append(h("button", { class: "danger", onclick: async () => {
    if (!confirm("Delete this note, its audio and its replies?")) return;
    try { await api("notes/" + id, { method: "DELETE" }); location.hash = "#/"; } catch (err) { fail(err); }
  } }, "Delete"));

  const audio = h("audio", { controls: true, preload: "metadata", src: `/api/notes/${id}/audio` });
  audio.addEventListener("error", () => audio.remove());

  show(
    h("a", { class: "back", href: "#/" }, "← All notes"),
    h("div", { class: "note-view" },
      textBox,
      h("div", { class: "stamp" }, dateTime(n.recorded_at), n.status !== "done" ? pill(n.status) : null)),
    n.audio_bytes ? audio : null,
    tags,
    n.responses.map((r) => h("section", { class: "reply" },
      h("header", {}, h("strong", {}, r.agent), h("span", {}, `${r.input_tokens} in · ${r.output_tokens} out`)),
      h("div", { class: "text" }, r.text))),
    n.tool_calls.length ? h("section", { class: "block" }, h("h2", { class: "label" }, "Tool calls"),
      h("div", { class: "calls" }, n.tool_calls.map((c) => h("details", {},
        h("summary", { class: c.is_error ? "bad" : "" }, `${c.server}.${c.tool}`, c.is_error ? " (error)" : ""),
        c.arguments ? h("pre", {}, c.arguments) : null, c.result ? h("pre", {}, c.result) : null)))) : null,
    h("dl", { class: "facts" }, facts.map(([k, v]) => [h("dt", {}, k), h("dd", {}, v)])),
    actions);
}

async function act(promise) {
  try { await promise; route(); } catch (err) { fail(err); }
}

// Configuration.

async function config() {
  const c = await api("config");
  if (!c.editable) return show(h("section", { class: "block" }, h("h2", { class: "label" }, "Configuration"), h("p", {}, c.reason)));
  const area = h("textarea", { id: "config-text", rows: 28, spellcheck: false, "aria-label": "riverbed.toml" });
  area.value = c.text;
  const message = h("p", {});
  show(h("section", { class: "block" }, h("h2", { class: "label" }, "Configuration"), h("p", { class: "path" }, c.path)),
    h("form", { class: "config", onsubmit: async (e) => {
      e.preventDefault();
      message.className = "";
      try {
        await api("config", { method: "PUT", body: { text: area.value } });
        message.textContent = "Saved. Restart Riverbed to apply it.";
      } catch (err) {
        message.className = "error";
        message.textContent = err.message;
      }
    } }, area, h("button", { class: "primary" }, "Save"), message),
    h("p", { class: "muted" }, "Values such as ${VAR} are read from the environment when Riverbed starts, so keep secrets there."));
}

// Status.

function table(head, rows) {
  return h("div", { class: "scroll" }, h("table", {}, h("tr", {}, head.map((t) => h("th", {}, t))),
    rows.map((r) => h("tr", {}, r.map((c) => h("td", {}, c))))));
}

const block = (title, ...content) => h("section", { class: "block" }, h("h2", { class: "label" }, title), content);

function showStatus() {
  const s = status;
  const counts = ["pending", "running", "done", "failed"].map((k) =>
    h("a", { class: "count", href: "#/?status=" + k }, h("b", {}, String(s.counts[k] || 0)), pill(k)));
  show(
    block("Notes", h("div", { class: "counts" }, counts)),
    block("System", h("dl", { class: "facts", style: "border:0;padding:0" },
      h("dt", {}, "Version"), h("dd", {}, s.version),
      h("dt", {}, "Embedding"), h("dd", {}, s.embedding.enabled ? `${s.embedding.kind} ${s.embedding.model}` : "off (keyword search only)"),
      h("dt", {}, "Audio"), h("dd", {}, s.audio_retained ? "kept" : "discarded"),
      h("dt", {}, "MCP server"), h("dd", {}, s.mcp_serve ? "on" : "off"),
      h("dt", {}, "Login"), h("dd", {}, s.auth ? "password" : "none"))),
    block("Routing",
      h("p", {}, `Default route ${s.router.default}` + (s.router.classifier ? `, classifier ${s.router.classifier}.` : ".")),
      s.router.rules.length ? table(["Match", "Agent", "Strip", "Tags"],
        s.router.rules.map((r) => [r.match, r.agent, r.strip ? "yes" : "", r.tags.join(", ")])) : null),
    block("Agents", s.agents.length ? table(["Name", "Kind", "Model"], s.agents.map((a) => [a.name, a.kind, a.model])) : h("p", { class: "muted" }, "None configured.")),
    block("MCP servers", s.mcp.length ? table(["Name", "URL", "Transport", "Auth", "Agents"],
      s.mcp.map((m) => [m.name, m.url, m.transport, m.auth, m.agents.join(", ") || "all"])) : h("p", { class: "muted" }, "None configured.")),
    h("p", { class: "muted" }, "Settings are read-only here. Edit them on the Config page and restart."));
}

// Routing.

async function route() {
  try {
    // Status doubles as the session check, and its router data feeds the filters.
    status = await api("status");
    logoutButton.hidden = !status.auth;
    const [path, query = ""] = location.hash.slice(1).split("?");
    const params = new URLSearchParams(query);
    const section = path === "/status" ? "status" : path === "/config" ? "config" : "notes";
    for (const a of document.querySelectorAll("nav a")) {
      if (a.dataset.section === section) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    }
    const note = path.match(/^\/note\/(\d+)$/);
    if (note) await detail(note[1]);
    else if (path === "/status") showStatus();
    else if (path === "/config") await config();
    else await list(params);
  } catch (err) {
    fail(err);
  }
}

addEventListener("hashchange", route);
route();
</script>
</body>
</html>
